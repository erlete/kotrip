name: Bug General (Full Stack)
description: Solicitud de resolución de error generalizado a nivel de infraestructura
title: '[GB]: '
labels:
  - full-stack
  - bug
body:
  - type: markdown
    attributes:
      value: |
        ## Bug General (Full Stack)
        Usa esta plantilla para reportar un error que afecta tanto al frontend como al backend, o a nivel de infraestructura.

  - type: textarea
    id: descripcion
    attributes:
      label: Descripción del bug
      description: Describe el error de forma clara y concisa.
      placeholder: |
        Al hacer X, ocurre Y en vez de Z...
    validations:
      required: true

  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      description: Lista los pasos para reproducir el error.
      placeholder: |
        1. Ir a /...
        2. Realizar la acción X
        3. Se observa el error Y
    validations:
      required: true

  - type: textarea
    id: comportamiento-esperado
    attributes:
      label: Comportamiento esperado
      description: '¿Qué debería pasar en su lugar?'
    validations:
      required: true

  - type: textarea
    id: areas-afectadas
    attributes:
      label: Áreas afectadas
      description: '¿Qué partes del sistema se ven afectadas? (frontend, backend, base de datos, infra, etc.)'
      placeholder: |
        - Frontend: página /dashboard
        - Backend: módulo de auth
    validations:
      required: true

  - type: textarea
    id: contexto
    attributes:
      label: Contexto adicional
      description: 'Logs, capturas, PRs relacionados, o cualquier información extra.'
    validations:
      required: false
