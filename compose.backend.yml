name: ${PROJECT_NAME:-kotrip}

services:
  # region Data Services

  postgres:
    image: postgres:17.7-alpine3.22
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      TZ: ${TZ}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    platform: linux/x86_64
    security_opt:
      - no-new-privileges:true

  redis-backend:
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - redis-backend-data:/data
    environment:
      REDIS_PASSWORD: ${BACKEND_REDIS_PASSWORD}
    networks:
      - data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a $$REDIS_PASSWORD ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 12
    command: >
      redis-server --appendonly yes --appendfsync everysec --requirepass "${BACKEND_REDIS_PASSWORD}"
    platform: linux/x86_64
    security_opt:
      - no-new-privileges:true

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    volumes:
      - minio-data:/data
    environment:
      TZ: ${TZ}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER: 'on'
    networks:
      - data
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9000/minio/health/live || exit 1']
      interval: 10s
      timeout: 3s
      retries: 12
    command: >
      server /data --address ":9000" --console-address ":9001"
    platform: linux/x86_64
    security_opt:
      - no-new-privileges:true

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamav-db:/var/lib/clamav
    environment:
      TZ: ${TZ}
      CLAMD_CONF_MaxFileSize: ${CLAMAV_MAX_FILE_SIZE}
      CLAMD_CONF_MaxScanSize: ${CLAMAV_MAX_SCAN_SIZE}
      CLAMD_CONF_StreamMaxLength: ${CLAMAV_STREAM_MAX_LENGTH}
    networks:
      - data
      - egress # For virus database updates.
    healthcheck:
      test: ['CMD-SHELL', "echo 'PING' | nc -w 5 localhost 3310"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 20s
    platform: linux/x86_64
    security_opt:
      - no-new-privileges:true

  # region Backend Services

  backend:
    image: ${PROJECT_NAME:-kotrip}/backend:prod
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis-backend:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
    ports:
      - '3${STACK_INDEX:-0}50:3000'
    volumes:
      - app-logs:/var/log/app
    environment:
      TZ: ${TZ}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

      BACKEND_REDIS_HOST: redis-backend
      BACKEND_REDIS_PORT: 6379
      BACKEND_REDIS_PASSWORD: ${BACKEND_REDIS_PASSWORD}

      RESET_KEY: ${RESET_KEY}

      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      IV: ${IV}
      JWT_GLOBAL: ${JWT_GLOBAL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      INVITE_EXPIRATION: ${INVITE_EXPIRATION}

      FALLBACK_LANGUAGE: ${FALLBACK_LANGUAGE}
      NODE_ENV: production

      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKET: ${MINIO_DEFAULT_BUCKET}
      MINIO_SHARE_BASE_URL: ${MINIO_SHARE_BASE_URL:-/api/storage}
      MINIO_SHARE_EXPIRATION_SECONDS: ${MINIO_SHARE_EXPIRATION_SECONDS:-3600}

      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      CLAMAV_TIMEOUT: ${CLAMAV_TIMEOUT:-30000}

    networks:
      - backend
      - data
      - egress
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    init: true
    platform: linux/x86_64
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  redis-backend-data:
  app-logs:
  minio-data:
  clamav-db:

include:
  - compose.networks.yml
