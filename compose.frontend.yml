name: ${PROJECT_NAME:-kotrip}

services:
  # region Frontend Services

  frontend:
    image: ${PROJECT_NAME:-kotrip}/frontend:prod
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-prod
    restart: unless-stopped
    ports:
      - '3${STACK_INDEX:-0}60:3000'
    volumes:
      - app-logs:/var/log/app
    environment:
      TZ: ${TZ}
      NEXT_TELEMETRY_DISABLED: 1

      BACKEND_CLUSTER_HOST: ${BACKEND_CLUSTER_HOST:-backend}
      BACKEND_CLUSTER_PORT: ${BACKEND_CLUSTER_PORT:-3000}

      AUTH_SECRET: ${AUTH_SECRET}

      # Cookie and token refresh configuration
      COOKIE_SECURE: ${COOKIE_SECURE}
      COOKIE_ACCESS_TOKEN_MAX_AGE: ${COOKIE_ACCESS_TOKEN_MAX_AGE}
      COOKIE_REFRESH_TOKEN_MAX_AGE: ${COOKIE_REFRESH_TOKEN_MAX_AGE}
      COOKIE_SESSION_MAX_AGE: ${COOKIE_SESSION_MAX_AGE}
      TOKEN_REFRESH_THRESHOLD: ${TOKEN_REFRESH_THRESHOLD}
      SESSION_UPDATE_THROTTLE: ${SESSION_UPDATE_THROTTLE}
    networks:
      - backend
      - egress
    init: true
    platform: linux/x86_64
    security_opt:
      - no-new-privileges:true

volumes:
  app-logs:

include:
  - compose.networks.yml
